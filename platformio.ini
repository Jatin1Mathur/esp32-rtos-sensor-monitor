; ESP32 / M5Stack Core, Arduino framework on top of FreeRTOS (ESP-IDF).
;
;   pio run -e m5stack-sht3x    real SHT3x sensor on I2C (Port A)
;   pio run -e m5stack-replay   no sensor needed: replays real recorded data
;                               (UCI/Kaggle Occupancy Detection, data/README.md)

[env]
platform = espressif32 @ ^6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 defaults to gnu++11; the core library uses C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3

[env:m5stack-sht3x]

[env:m5stack-replay]
build_flags =
    ${env.build_flags}
    -DUSE_REPLAY_SENSOR
