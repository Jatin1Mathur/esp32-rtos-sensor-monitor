; ESP32 / M5Stack Core, Arduino framework on top of FreeRTOS (ESP-IDF).
[env:m5stack-core-esp32]
platform = espressif32 @ ^6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 defaults to gnu++11; the core library uses C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
